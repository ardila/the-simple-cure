<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&display=swap"><style>
  :root {
    --ivory-light: #faf9f5;
    --ivory-medium: #f0eee6;
    --ivory-dark: #e8e6dc;
    --cloud-light: #d1cfc5;
    --cloud-medium: #b0aea5;
    --cloud-dark: #87867f;
    --slate-light: #5e5d59;
    --slate-medium: #3d3d3a;
    --slate-dark: #1f1e1d;

    --bg: var(--ivory-medium);
    --bg-raised: var(--ivory-light);
    --text: var(--slate-dark);
    --text-secondary: var(--slate-light);
    --border: var(--cloud-light);
    --link-hover: var(--slate-light);
    --chip: rgba(31, 30, 29, 0.08);
    --chip-hover: rgba(31, 30, 29, 0.16);
    --shadow: 0 8px 32px rgba(31, 30, 29, 0.14);

    --serif: "Newsreader", "Times New Roman", Times, serif;
    --measure: 38.75rem;
    --headerH: 3.75rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--slate-dark);
      --bg-raised: #2e2d2b;
      --text: #e1dfd8;
      --text-secondary: var(--cloud-dark);
      --border: var(--slate-medium);
      --link-hover: var(--cloud-medium);
      --chip: rgba(240, 238, 230, 0.15);
      --chip-hover: rgba(240, 238, 230, 0.28);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--slate-dark);
    --bg-raised: #2e2d2b;
    --text: #e1dfd8;
    --text-secondary: var(--cloud-dark);
    --border: var(--slate-medium);
    --link-hover: var(--cloud-medium);
    --chip: rgba(240, 238, 230, 0.15);
    --chip-hover: rgba(240, 238, 230, 0.28);
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
    background: var(--bg);
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    font-size: 1.25rem;
    line-height: 1.6;
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .container {
    width: 100%;
    max-width: var(--measure);
    margin: 0 auto;
    padding: 0 1.25rem;
  }

  /* ---------- header ---------- */
  .header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--bg-raised);
    border-bottom: 1px solid var(--border);
    height: var(--headerH);
  }
  .header-inner {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
  }
  .header-name {
    font-size: 1.375rem;
    font-weight: 600;
    line-height: 1;
    margin: 0;
  }
  .header-name a { color: inherit; text-decoration: none; }
  .header-name a:hover { color: var(--link-hover); }
  .header-tag {
    position: absolute;
    right: 3.25rem;
    font-size: 0.9375rem;
    color: var(--text-secondary);
    text-decoration: none;
    white-space: nowrap;
  }
  .header-tag:hover { color: var(--text); }

  .icon-btn {
    position: absolute;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    padding: 0;
    border: 0;
    border-radius: 0.25rem;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--chip); }
  .icon-btn svg { width: 1.25rem; height: 1.25rem; display: block; }
  .toc-toggle { left: 1rem; }
  .theme-toggle { right: 1rem; }
  .toc-toggle .icon-close, .toc-toggle[aria-expanded="true"] .icon-open { display: none; }
  .toc-toggle[aria-expanded="true"] .icon-close { display: block; }
  :root[data-theme="dark"] .icon-sun, .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .icon-moon { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .icon-sun { display: none; }
    :root:not([data-theme="light"]) .icon-moon { display: block; }
  }

  /* ---------- contents sidebar ---------- */
  .toc {
    position: fixed;
    top: var(--headerH);
    left: 0;
    bottom: 0;
    z-index: 30;
    width: 17rem;
    padding: 2.25rem 1.5rem 3rem;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--bg);
    border-right: 1px solid var(--border);
    transform: translateX(-100%);
    visibility: hidden;
    transition: transform 0.22s ease, visibility 0.22s;
  }
  .toc.is-open { transform: translateX(0); visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .toc { transition: none; } }
  .toc-title {
    font-size: 1.125rem;
    font-weight: 600;
    margin: 0 0 1rem;
  }
  .toc ol { list-style: none; margin: 0; padding: 0; counter-reset: toc; }
  .toc li { margin-bottom: 0.5rem; }
  .toc a {
    display: block;
    font-size: 1.0625rem;
    line-height: 1.4;
    color: var(--text-secondary);
    text-decoration: none;
  }
  .toc a:hover, .toc a.is-current { color: var(--text); }
  .toc-scrim {
    position: fixed;
    inset: var(--headerH) 0 0;
    z-index: 25;
    background: rgba(31, 30, 29, 0.4);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.22s ease, visibility 0.22s;
  }
  .toc-scrim.is-open { opacity: 1; visibility: visible; }
  @media (min-width: 78rem) {
    .toc { border-right: none; background: transparent; }
    .toc-scrim { display: none; }
  }

  /* ---------- title block ---------- */
  .titleblock { padding-top: 2.25rem; }
  .post-title {
    font-size: clamp(2.625rem, 9vw, 3.875rem);
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 0.4rem;
  }
  .post-subtitle {
    font-size: 1.375rem;
    line-height: 1.6;
    font-style: italic;
    margin: 0;
  }
  .post-byline {
    font-size: 1.125rem;
    line-height: 1.6;
    color: var(--text-secondary);
    margin: 2.25rem 0 1.125rem;
  }
  .post-byline a { color: inherit; }

  /* ---------- article ---------- */
  article h2 {
    font-size: 2rem;
    line-height: 1.2;
    font-weight: 600;
    margin: 2.75rem 0 1rem;
    scroll-margin-top: calc(var(--headerH) + 1.5rem);
  }
  article p { margin: 0 0 1.25rem; }
  article ol, article ul { margin: 0 0 1.5rem; padding-left: 1.5rem; }
  article li { margin-bottom: 0.75rem; }
  article li::marker { color: var(--text-secondary); }
  article strong { font-weight: 600; }
  article em { font-style: italic; }

  a { color: var(--text); }
  article a, .footnotes a {
    color: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1.6px;
    text-underline-offset: 2px;
    text-decoration-color: currentColor;
    transition: color 0.12s ease, text-decoration-color 0.12s ease;
  }
  article a:hover, .footnotes a:hover { color: var(--link-hover); }
  /* the Sources dump is nearly all links; keep its rules quiet */
  #sources ~ p a { text-decoration-color: var(--border); }
  #sources ~ p a:hover { text-decoration-color: currentColor; }

  /* ---------- footnotes ---------- */
  sup { line-height: 0; }
  a.footnote-ref {
    display: inline-block;
    padding: 0 3px;
    border-radius: 3px;
    background: var(--chip);
    font-size: 0.68em;
    font-weight: 500;
    line-height: 1.5;
    vertical-align: super;
    color: inherit;
    text-decoration: none;
  }
  a.footnote-ref:hover, a.footnote-ref:focus-visible { background: var(--chip-hover); }
  a.footnote-ref sup { line-height: inherit; vertical-align: baseline; }

  .dinkus {
    border: 0;
    margin: 3rem 0;
    color: var(--text-secondary);
    text-align: center;
  }
  .dinkus::before {
    content: "* * *";
    letter-spacing: 0.5em;
    font-size: 1rem;
  }

  figure { margin: 2.25rem 0; }
  figure svg { width: 100%; height: auto; display: block; }
  figure svg text { font-family: var(--serif); }
  figcaption {
    font-size: 0.9375rem;
    line-height: 1.5;
    color: var(--text-secondary);
    margin-top: 0.625rem;
  }
  .footnotes h2 { font-size: 1.5rem; margin-bottom: 1.5rem; }
  .footnotes ol {
    margin: 0;
    padding-left: 1.5rem;
    font-size: 1.0625rem;
    line-height: 1.55;
    color: var(--text-secondary);
  }
  .footnotes li { margin-bottom: 1.25rem; scroll-margin-top: calc(var(--headerH) + 1.5rem); }
  .footnotes li::marker { color: var(--cloud-dark); }
  .footnotes li p { margin: 0; }
  .footnotes li p + table, .footnotes li table + p { margin-top: 0.75rem; }
  .footnotes table {
    border-collapse: collapse;
    margin: 0.75rem 0;
    font-size: 0.9375rem;
    line-height: 1.45;
  }
  .footnotes th, .footnotes td {
    padding: 0.3rem 1.5rem 0.3rem 0;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-weight: 400;
  }
  .footnotes thead th { font-weight: 600; }
  .footnotes th:not(:first-child), .footnotes td:not(:first-child) { text-align: right; padding-right: 0; padding-left: 1.5rem; }
  .footnotes a { text-decoration-color: var(--cloud-dark); }
  a.footnote-back { text-decoration: none; margin-left: 0.25rem; }

  .fn-tooltip {
    position: absolute;
    z-index: 60;
    max-width: min(24rem, calc(100vw - 2rem));
    padding: 0.875rem 1rem;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 0.375rem;
    box-shadow: var(--shadow);
    font-size: 1rem;
    line-height: 1.5;
    color: var(--text);
    max-height: 60vh;
    overflow-y: auto;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.14s ease, visibility 0.14s;
  }
  .fn-tooltip.is-visible { opacity: 1; visibility: visible; }
  .fn-tooltip .footnote-back { display: none; }
  @media (hover: none) { .fn-tooltip { display: none; } }

  /* ---------- footer ---------- */
  .endmatter {
    margin-top: 3.5rem;
    padding: 1.5rem 0 4rem;
    border-top: 1px solid var(--border);
    font-size: 1rem;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .endmatter a { color: inherit; text-decoration: none; }
  .endmatter a:hover { color: var(--text); }

  :focus-visible { outline: 2px solid var(--link-hover); outline-offset: 2px; }

  .skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    z-index: 100;
    padding: 0.5rem 1rem;
    background: var(--bg-raised);
    border: 1px solid var(--border);
  }
  .skip-link:focus { left: 0.5rem; top: 0.5rem; }

  @media (max-width: 40rem) {
    body { font-size: 1.1875rem; }
    article h2 { font-size: 1.75rem; }
    .post-subtitle { font-size: 1.1875rem; }
    .header-tag { display: none; }
  }

  @media print {
    .header, .toc, .toc-scrim, .fn-tooltip, .endmatter { display: none !important; }
    body { background: #fff; color: #000; font-size: 11pt; }
    .container { max-width: none; }
    article a { text-decoration: none; }
  }
</style></head>
